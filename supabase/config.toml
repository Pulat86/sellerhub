project_id = "sellerhub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.settings]
# Разрешаем pg_cron вызывать функции схемы extensions под postgres-ролью.
cron.database_name = "postgres"

[[db.extensions]]
name = "pg_cron"
schema = "extensions"

[[db.extensions]]
name = "pg_net"
schema = "extensions"

[auth]
enabled = true
site_url = "http://localhost:5173"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = true
port = 54323
