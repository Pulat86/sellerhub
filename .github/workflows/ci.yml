name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Миграции и тест изоляции тенантов
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Поднимаем локальный стек. Миграции из supabase/migrations применяются автоматически.
      - name: Поднять локальный Supabase
        run: supabase start

      # Явный прогон с нуля: база уничтожается и миграции накатываются по порядку.
      # Падает здесь — значит миграция не применится и на проде.
      - name: Применить миграции с нуля
        run: supabase db reset

      # Тест изоляции гоняется через psql: у Supabase CLI нет команды для
      # выполнения произвольного SQL-файла. psql предустановлен на ubuntu-latest.
      - name: Тест изоляции тенантов
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          OUT=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation.sql)
          echo "$OUT"
          if echo "$OUT" | grep -q 'ПРОВАЛ'; then
            echo '::error::Тест изоляции тенантов провален — данные утекают между компаниями'
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'OK'; then
            echo '::error::Тест не вернул ни одной строки — молчаливый пропуск хуже падения'
            exit 1
          fi

      - name: Линтер базы
        run: supabase db lint --level error --fail-on error

  web:
    name: Сборка фронтенда
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install

      - name: Линтер
        run: npm run lint

      # tsc -b внутри build — типы проверяются здесь же.
      # Ключи публичные, поэтому берём их из .env.example — секреты не нужны.
      - name: Сборка
        run: |
          cp .env.example .env
          npm run build

  types:
    name: Типы из схемы
    runs-on: ubuntu-latest
    # Локальной разработки нет и Supabase CLI на машинах команды не стоит.
    # Единственное место, где типы могут быть перегенерированы, — этот джоб.
    # Без него после каждой миграции клиент Supabase не видит новые таблицы.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [migrations]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Генерируем из локального стека, а не из --linked: локальный собран
      # ровно из миграций репозитория. Прод может отставать, и тогда типы
      # описывали бы схему, которой в коде уже нет.
      - name: Поднять локальный Supabase
        run: supabase start

      - name: Сгенерировать типы
        run: supabase gen types --lang typescript --local > apps/web/src/types/database.gen.ts

      - name: Закоммитить, если схема изменилась
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/src/types/database.gen.ts; then
            echo 'Типы уже соответствуют схеме — коммит не нужен.'
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/types/database.gen.ts
          # [skip ci] обязателен: без него коммит бота запустит CI заново
          # и джоб будет вызывать сам себя по кругу.
          git commit -m 'chore(types): регенерация из схемы [skip ci]'
          git push

  deploy-functions:
    name: Деплой Edge Functions
    runs-on: ubuntu-latest
    # Деплоим только при пуше в main, не на PR — функции сразу идут на прод.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [migrations, web]

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Задеплоить dispatch-jobs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy dispatch-jobs \
            --project-ref iijjyggbbvrqcbrkjupr \
            --no-verify-jwt
