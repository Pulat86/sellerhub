name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Миграции и тест изоляции тенантов
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Поднимаем локальный стек. Миграции из supabase/migrations применяются автоматически.
      - name: Поднять локальный Supabase
        run: supabase start

      # Явный прогон с нуля: база уничтожается и миграции накатываются по порядку.
      # Падает здесь — значит миграция не применится и на проде.
      - name: Применить миграции с нуля
        run: supabase db reset

      # Тест изоляции гоняется через psql: у Supabase CLI нет команды для
      # выполнения произвольного SQL-файла. psql предустановлен на ubuntu-latest.
      - name: Тест изоляции тенантов
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          OUT=$(psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation.sql)
          echo "$OUT"
          if echo "$OUT" | grep -q 'ПРОВАЛ'; then
            echo '::error::Тест изоляции тенантов провален — данные утекают между компаниями'
            exit 1
          fi
          if ! echo "$OUT" | grep -q 'OK'; then
            echo '::error::Тест не вернул ни одной строки — молчаливый пропуск хуже падения'
            exit 1
          fi

      - name: Линтер базы
        run: supabase db lint --level error --fail-on error

  web:
    name: Сборка фронтенда
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install

      - name: Линтер
        run: npm run lint

      # tsc -b внутри build — типы проверяются здесь же.
      # Ключи публичные, поэтому берём их из .env.example — секреты не нужны.
      - name: Сборка
        run: |
          cp .env.example .env
          npm run build
